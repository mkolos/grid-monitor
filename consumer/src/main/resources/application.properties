spring.application.name=consumer

spring.datasource.url=jdbc:postgresql://localhost:5432/grid_monitor
spring.datasource.username=grid
spring.datasource.password=grid

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=grid-monitor-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.smartgrid.consumer.model.Reading
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartgrid.consumer.model

grid.consumer.topic=electricity-readings
grid.consumer.group-id=grid-monitor-consumer
grid.consumer.worker-count=8
grid.consumer.queue-capacity=500
