spring.application.name=analyzer
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/grid_monitor
spring.datasource.username=grid
spring.datasource.password=grid

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2

grid.analyzer.scan-interval=30s
grid.analyzer.history-window=15m
grid.analyzer.voltage-nominal-v=230
grid.analyzer.voltage-tolerance-pct=10
grid.analyzer.power-zscore-threshold=3.0
grid.analyzer.min-history-samples=5
